name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: checkout
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        name: setup[mise]
        with:
          install_args: bun just
      - name: deps
        run: bun install --frozen-lockfile
      - name: deps[vscode]
        run: cd ext/vscode && bun install --frozen-lockfile
      - name: check
        run: just check
      - name: test
        run: just test
      - name: package
        run: just build-vscode
